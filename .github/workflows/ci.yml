name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  security-events: write
  pages: write
  id-token: write

jobs:
  CI:
    uses: beam-bots/.github/.github/workflows/elixir-ci.yml@ec6df4c8b2061c44a576b659abd260c9db524c97 # main
    with:
      # `nerves_runtime` reaches `nerves_uevent`, which builds C against libmnl,
      # and `vintage_net_wifi` builds against libnl-genl. Both are optional
      # dependencies here, carried so dialyzer has their types.
      os-packages: libmnl-dev libnl-genl-3-dev
      enable-docs-deploy: true
      enable-release: true
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
