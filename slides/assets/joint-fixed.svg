<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 58 180 184">
  <!--
    Fixed: two links bolted solidly together. No animation, which is the whole
    joke and also the whole point — so the drawing has to do all the work.

    The seam, the bolts straddling it and the corner gussets are what say "these
    are two separate parts held rigidly", rather than "this is one lump".
  -->
  <defs>
    <pattern id="hatch-f" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1a1a1a" stroke-opacity="0.35" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="150" y="210" width="100" height="26" fill="url(#hatch-f)" stroke="#1a1a1a" stroke-width="3"/>

  <!-- gussets, so the join reads as deliberate rather than as a butt joint -->
  <path d="M 168 210 L 168 192 L 150 210 z" fill="#1a1a1a" fill-opacity="0.45"/>
  <path d="M 232 210 L 232 192 L 250 210 z" fill="#1a1a1a" fill-opacity="0.45"/>

  <rect x="168" y="110" width="64" height="100" fill="#1a1a1a"/>

  <!-- bolts straddling the seam -->
  <circle cx="182" cy="210" r="8" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="218" cy="210" r="8" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3"/>
</svg>
